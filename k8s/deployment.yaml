apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-churn-api
  namespace: mlops-prod
  labels:
    app.kubernetes.io/name: mlops-churn-api
    app.kubernetes.io/instance: mlops-churn-api-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: inference-service
    app.kubernetes.io/part-of: mlops-churn-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mlops-churn-api
  template:
    metadata:
      labels:
        app: mlops-churn-api
        app.kubernetes.io/name: mlops-churn-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inference-engine
          image: mlops-churn-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mlops-api-config
            - secretRef:
                name: mlops-api-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
