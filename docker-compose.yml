version: '3.8'

services:
  mlops-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-churn-api:latest
    container_name: mlops-churn-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local-docker
      - MODEL_PATH=/app/artifacts/model.joblib
      - METRICS_PATH=/app/artifacts/metrics.json
      - MODEL_VERSION=v1.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - mlops-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mlops-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - mlops-api
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
