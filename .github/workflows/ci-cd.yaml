name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: mlops-churn-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # =============================================================
  # Stage 1: Lint & Code Style
  # =============================================================
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 120
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # =============================================================
  # Stage 2: Model Training & Validation Gate
  # =============================================================
  train-and-validate:
    name: 🏋️ Train & Validate Model
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Training Pipeline
        run: |
          python -m src.train

      - name: Verify Model Artifacts & Performance Gate
        run: |
          python -c "
          import json, os, sys
          assert os.path.exists('artifacts/model.joblib'), 'Model artifact missing!'
          assert os.path.exists('artifacts/metrics.json'), 'Metrics file missing!'
          with open('artifacts/metrics.json') as f:
              metrics = json.load(f)
          print('Loaded Model Metrics:', metrics)
          assert metrics['accuracy'] >= 0.65, f'Accuracy too low: {metrics[\"accuracy\"]}'
          assert metrics['roc_auc'] >= 0.60, f'ROC-AUC too low: {metrics[\"roc_auc\"]}'
          print('✅ Model passed quality gate!')
          "

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 7

  # =============================================================
  # Stage 3: Automated Unit & API Tests
  # =============================================================
  test:
    name: 🧪 Automated Tests (Pytest)
    runs-on: ubuntu-latest
    needs: train-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  # =============================================================
  # Stage 4: Docker Container Build & Integration Probe
  # =============================================================
  docker-build:
    name: 🐳 Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.IMAGE_NAME }}:latest

      - name: Test Container Health In CI Runner
        run: |
          docker run -d --name test-api -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "Waiting for container to initialize..."
          sleep 5
          docker logs test-api
          # Probe liveness and readiness
          curl --fail http://localhost:8000/health/live || exit 1
          curl --fail http://localhost:8000/health/ready || exit 1
          # Test sample prediction
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"credit_score":650,"country":"Germany","gender":"Female","age":42,"tenure":5,"balance":85000.5,"num_of_products":2,"has_cr_card":1,"is_active_member":1,"estimated_salary":65000.0}'
          docker stop test-api

  # =============================================================
  # Stage 5: Kubernetes Manifests Validation
  # =============================================================
  k8s-validate:
    name: ☸️ Kubernetes Manifest Linting
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests (Dry Run)
        run: |
          kubectl apply --dry-run=client -k k8s/
          echo "✅ All Kubernetes manifests are syntactically valid!"
